<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link Ulasan Google Maps</title>
    
    <!-- Library QR Code (qrcodejs) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        h2 { margin-top: 0; color: #333; font-size: 22px;}
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 20px; line-height: 1.4;}
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            font-size: 14px; 
            margin-bottom: 15px; 
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { outline: none; border-color: #667eea; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #667eea; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.3s;
        }
        button:hover { background: #5568d3; }
        
        /* Area Hasil */
        #result-area { margin-top: 25px; display: none; }
        #link-output { 
            width: 100%; 
            padding: 10px; 
            background: #e8f0fe; 
            border: 1px dashed #667eea; 
            border-radius: 6px; 
            font-size: 13px; 
            color: #333;
            margin-bottom: 15px;
            word-break: break-all;
        }
        
        /* Styling kotak QR */
        #qrcode { 
            display: flex; 
            justify-content: center; 
            margin-bottom: 15px;
        }
        #qrcode img { 
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .btn-download {
            background: #28a745;
        }
        .btn-download:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>📍 Link Ulasan Langsung</h2>
        <p class="subtitle">Masukkan Place ID lokasi untuk membuat link yang langsung membuka form ulasan Google Maps.</p>
        
        <input type="text" id="placeId" placeholder="Contoh: ChIJN1t_tDeuEmsRUsoyG83frY4">
        <button onclick="generateQR()">Buat Link & QR Code</button>

        <div id="result-area">
            <input type="text" id="link-output" readonly onclick="this.select()" title="Klik untuk copy">
            <div id="qrcode"></div>
            <button class="btn-download" onclick="downloadQR()">⬇️ Download QR Code</button>
        </div>
    </div>

    <script>
        function generateQR() {
            const placeId = document.getElementById('placeId').value.trim();
            const resultArea = document.getElementById('result-area');
            const linkOutput = document.getElementById('link-output');
            const qrContainer = document.getElementById('qrcode');

            // Validasi input
            if (!placeId) {
                alert('Silakan masukkan Place ID terlebih dahulu!');
                return;
            }

            // 1. Buat URL Google Maps Review
            const reviewUrl = `https://search.google.com/local/writereview?placeid=${placeId}`;
            
            // 2. Tampilkan hasil dan isi input link
            resultArea.style.display = 'block';
            linkOutput.value = reviewUrl;

            // 3. Bersihkan QR Code sebelumnya (jika ada)
            qrContainer.innerHTML = '';

            // 4. Generate QR Code Baru menggunakan qrcodejs
            new QRCode(qrContainer, {
                text: reviewUrl,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        function downloadQR() {
            const qrImage = document.querySelector('#qrcode img');
            
            // Pastikan gambar QR sudah terbuat
            if (!qrImage) {
                alert('QR Code belum dibuat!');
                return;
            }

            // Buat elemen <a> untuk mendownload gambar
            const link = document.createElement('a');
            link.download = 'qrcode-ulasan.png';
            link.href = qrImage.src;
            link.click();
        }

        // Jalankan fungsi jika user menekan tombol Enter
        document.getElementById('placeId').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                generateQR();
            }
        });
    </script>

</body>
</html>
